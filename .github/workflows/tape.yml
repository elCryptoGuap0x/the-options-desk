name: 24/7 tape refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tape-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python3 scripts/tape_update.py
      - name: Commit and push if changed
        run: |
          git config user.name "tape-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet feed.json; then
            git add feed.json
            git commit -m "24/7 tape refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes -- skipping commit."
          fi
